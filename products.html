<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0df">
  <title>Shop all | ShopHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="siteHeader"></header>
  <main class="page-shell products">
    <div class="products-heading">
      <p class="eyebrow">THE HAPPY FINDS</p>
      <h1 class="section-heading">Shop all products</h1>
      <p class="section-intro">Browse our little collection of everyday favorites.</p>
    </div>
    <div class="product-tools glass-panel">
      <label class="sr-only" for="searchInput">Filter products</label>
      <input type="search" id="searchInput" placeholder="Search the collection…" autocomplete="off">
      <label class="sr-only" for="filterCategory">Filter by category</label>
      <select id="filterCategory" aria-label="Filter by category">
        <option value="all">All categories</option>
        <option value="Electronics &amp; Gadgets">Electronics &amp; Gadgets</option>
        <option value="Fashion">Fashion</option>
      </select>
    </div>
    <div id="productsContainer" class="product-grid" aria-live="polite"></div>
  </main>
  <footer id="siteFooter"></footer>
  <script src="js/shop-store.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
