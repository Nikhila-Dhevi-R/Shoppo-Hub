<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0df">
  <title>Log in | ShopHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="index.html" aria-label="ShopHub home">ShopHub<span aria-hidden="true">✦</span></a>
    <section class="form-box glass-panel" aria-labelledby="loginTitle">
      <p class="eyebrow">YOUR HAPPY PLACE TO SHOP</p>
      <h1 id="loginTitle">Welcome back</h1>
      <p class="auth-intro">Sign in and pick up where you left off.</p>
      <form id="loginForm" novalidate>
        <label for="loginEmail">Email address</label>
        <input type="email" id="loginEmail" name="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Your password" required>
        <p id="loginStatus" class="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <button class="button-primary auth-submit" type="submit">Log in <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">New to ShopHub? <a id="signupLink" href="signup.html">Create an account</a></p>
    </section>
    <a class="auth-back" href="index.html"><span aria-hidden="true">←</span> Back to the shop</a>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
