<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0df">
  <title>Your cart | ShopHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="siteHeader"></header>
  <main class="page-shell products">
    <div class="products-heading">
      <p class="eyebrow">YOUR LITTLE FINDS</p>
      <h1 class="section-heading">Shopping cart</h1>
      <p class="section-intro">Everything you picked, all together.</p>
    </div>
    <div id="cartItems" class="product-grid" aria-live="polite"></div>
    <section id="cartSummary" class="total-panel glass-panel" aria-live="polite">
      <h2 id="totalPrice"></h2>
      <a id="checkoutLink" class="button-primary" href="checkout.html">Continue to checkout <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <footer id="siteFooter"></footer>
  <script src="js/shop-store.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
