<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0df">
  <title>My profile | ShopHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body class="profile-page">
  <header id="siteHeader"></header>
  <main class="profile-main">
    <section class="profile-card glass-panel" aria-labelledby="profileTitle">
      <div class="profile-avatar" aria-hidden="true">✦</div>
      <p class="eyebrow">YOUR SHOPHUB ACCOUNT</p>
      <h1 id="profileTitle">My profile</h1>
      <p id="username" class="profile-name">Loading your name…</p>
      <p id="email" class="profile-email"></p>
      <p id="profileStatus" class="form-status" role="status" aria-live="polite"></p>
      <div class="profile-actions">
        <button id="ordersBtn" class="button-primary" type="button">My orders</button>
        <button id="wishlistBtn" class="button-secondary" type="button">Saved finds</button>
        <button id="profileLogoutBtn" class="button-quiet" type="button">Log out</button>
      </div>
    </section>
  </main>
  <footer id="siteFooter"></footer>
  <script src="js/shop-store.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/navbar.js"></script>
</body>
</html>
